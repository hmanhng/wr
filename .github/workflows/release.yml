# Manual release: validates the version, checks the committed prebuilt binaries, signs libloader.so,
# creates a draft release at this commit (all five assets, kept on GitHub), uploads libloader.so and the
# signed manifest to Cloudflare R2, publishes the release, then switches the R2 native-update feed
# (native/latest/native-manifest.txt) last. Never runs automatically.
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, exactly as the tag/title, e.g. 2.3 or v2.3.1 (MAJOR.MINOR[.PATCH])"
        required: true
        type: string

concurrency:
  group: wr-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_preflight.py validate
          echo "::warning title=AUTH_VER::The committed binaries are not rebuilt here. Make sure their embedded AUTH_VER matches this version before publishing."

      - name: Check R2 configuration
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name} is not set (see README, R2 setup)."
              exit 1
            fi
          done
          case "$R2_PUBLIC_URL" in
            https://*) ;;
            *) echo "::error::R2_PUBLIC_URL must start with https://"; exit 1 ;;
          esac

      - name: Check and stage prebuilt binaries
        run: |
          set -euo pipefail
          python3 .github/scripts/release_preflight.py check-binaries --root . --stage-dir "$RUNNER_TEMP/release-assets"

      - name: Check remote tag, release and version order
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SEQUENCE: ${{ steps.version.outputs.sequence }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_preflight.py check-remote

      - name: Sign libloader.so
        env:
          NATIVE_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.NATIVE_UPDATE_PRIVATE_KEY_PEM }}
          # Secret-derived values are dropped from step outputs, so the URL is rebuilt from env where needed.
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          TAG: ${{ steps.version.outputs.tag }}
          SEQUENCE: ${{ steps.version.outputs.sequence }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/native-key"
          trap 'rm -rf -- "$key_dir"' EXIT
          python3 .github/scripts/release_preflight.py write-key --dir "$key_dir"
          unset NATIVE_UPDATE_PRIVATE_KEY_PEM
          python3 .github/scripts/create-native-update.py \
            --library "$RUNNER_TEMP/release-assets/libloader.so" \
            --sequence "$SEQUENCE" \
            --url "${R2_PUBLIC_URL%/}/native/${TAG}/libloader.so" \
            --private-key "$key_dir/private.pem" \
            --output-dir "$RUNNER_TEMP/native-package" \
            --min-sdk 28

      - name: Verify signed package against the pinned public key
        env:
          NATIVE_UPDATE_PUBLIC_KEY: ${{ vars.NATIVE_UPDATE_PUBLIC_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          TAG: ${{ steps.version.outputs.tag }}
          SEQUENCE: ${{ steps.version.outputs.sequence }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_preflight.py verify-package \
            --package-dir "$RUNNER_TEMP/native-package" \
            --expected-sequence "$SEQUENCE" \
            --expected-url "${R2_PUBLIC_URL%/}/native/${TAG}/libloader.so"

      - name: Create draft release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release-assets"
          pkg="$RUNNER_TEMP/native-package"
          python3 .github/scripts/release_preflight.py notes \
            --output "$RUNNER_TEMP/release-notes.md" \
            --asset "$stage/libLogin.so" --asset "$stage/Injector" \
            --asset "$pkg/libloader.so" --asset "$pkg/native-manifest.txt" --asset "$pkg/public-key.txt"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$stage/libLogin.so" "$stage/Injector" \
            "$pkg/libloader.so" "$pkg/native-manifest.txt" "$pkg/public-key.txt"

      - name: Verify draft assets
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release-assets"
          pkg="$RUNNER_TEMP/native-package"
          python3 .github/scripts/release_preflight.py verify-draft \
            --asset "$stage/libLogin.so" --asset "$stage/Injector" \
            --asset "$pkg/libloader.so" --asset "$pkg/native-manifest.txt" --asset "$pkg/public-key.txt"

      - name: Upload native update to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Newer aws CLI versions add checksum headers that R2 rejects.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          public="${R2_PUBLIC_URL%/}"
          pkg="$RUNNER_TEMP/native-package"
          immutable="public, max-age=31536000, immutable"
          aws s3 cp "$pkg/libloader.so" "s3://${R2_BUCKET_NAME}/native/${TAG}/libloader.so" \
            --endpoint-url "$endpoint" \
            --content-type application/octet-stream --cache-control "$immutable"
          aws s3 cp "$pkg/native-manifest.txt" "s3://${R2_BUCKET_NAME}/native/${TAG}/native-manifest.txt" \
            --endpoint-url "$endpoint" \
            --content-type "text/plain; charset=us-ascii" --cache-control "$immutable"
          for name in libloader.so native-manifest.txt; do
            curl -fsS --retry 3 -H 'Accept-Encoding: identity' -o "$RUNNER_TEMP/r2-check" "${public}/native/${TAG}/${name}"
            if [ "$(sha256sum < "$RUNNER_TEMP/r2-check")" != "$(sha256sum < "$pkg/$name")" ]; then
              echo "::error::R2 object native/${TAG}/${name} does not match the local file."
              exit 1
            fi
          done

      - name: Publish release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true --silent

      - name: Switch native update feed on R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          public="${R2_PUBLIC_URL%/}"
          manifest="$RUNNER_TEMP/native-package/native-manifest.txt"
          aws s3 cp "$manifest" "s3://${R2_BUCKET_NAME}/native/latest/native-manifest.txt" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "text/plain; charset=us-ascii" --cache-control no-cache
          curl -fsS --retry 3 -H 'Accept-Encoding: identity' -o "$RUNNER_TEMP/r2-check" \
            "${public}/native/latest/native-manifest.txt?run=${GITHUB_RUN_ID}"
          if [ "$(sha256sum < "$RUNNER_TEMP/r2-check")" != "$(sha256sum < "$manifest")" ]; then
            echo "::error::native/latest/native-manifest.txt does not match the published manifest; copy native/<tag>/native-manifest.txt over it manually."
            exit 1
          fi

      - name: Remove signing key
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/native-key"
